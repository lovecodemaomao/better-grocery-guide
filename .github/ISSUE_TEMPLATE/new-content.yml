name: 新内容线索
description: 提供商品、地区或来源线索
title: "[资料] "
labels: [content]
body:
  - type: input
    id: product
    attributes:
      label: 商品、品种和地区
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: 希望补充的具体结论或问题
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 原始来源链接、发布日期、你核实的日期
    validations:
      required: true
